version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fraudex_postgres
    environment:
      POSTGRES_USER: fraudex
      POSTGRES_PASSWORD: fraudex_dev_password
      POSTGRES_DB: fraudex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudex"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraudex_backend
    environment:
      DATABASE_URL: postgresql://fraudex:fraudex_dev_password@postgres:5432/fraudex_db
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
